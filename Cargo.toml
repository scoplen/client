[workspace]
resolver = "3"
members = [
    "crates/scoplen-client-core",
    "crates/scoplen-client-platform",
    "crates/scoplen-mosh",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"
authors = ["Scoplen maintainers"]
repository = "https://github.com/scoplen/client"

[workspace.dependencies]
scoplen-client-core = { path = "crates/scoplen-client-core" }
scoplen-client-platform = { path = "crates/scoplen-client-platform" }
scoplen-ssh = { git = "https://github.com/scoplen/proto.git", rev = "22f5ef0" }
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["ed25519", "encryption", "getrandom", "p256", "p384", "p521", "rsa", "std"] }
base64 = "0.22.1"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
scoplen-crypto = { git = "https://github.com/scoplen/proto.git", rev = "22f5ef0" }
scoplen-model = { git = "https://github.com/scoplen/proto.git", rev = "22f5ef0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
sys-locale = "0.3.2"
tauri = { version = "2.12.1", features = [] }
tauri-build = { version = "2.5", features = [] }
tauri-plugin-dialog = "2.4.0"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2.0.17"
tempfile = "3.23.0"
tracing = "0.1.41"
tokio = { version = "1.17.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "=1.16.0", features = ["v7"] }
zeroize = "1.8.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[patch.crates-io]
pageant = { git = "https://github.com/scoplen/proto.git", rev = "22f5ef0" }
