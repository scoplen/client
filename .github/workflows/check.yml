name: check

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # proto is fetched by Git; the git CLI uses the credentials below.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # Read access to scoplen/proto while that repository is private.
  SCOPLEN_PROTO_TOKEN: ${{ secrets.SCOPLEN_PROTO_TOKEN }}

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authorize access to proto
        if: env.SCOPLEN_PROTO_TOKEN != ''
        shell: bash
        run: git config --global url."https://x-access-token:${SCOPLEN_PROTO_TOKEN}@github.com/scoplen/proto.git".insteadOf "https://github.com/scoplen/proto.git"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # pnpm is installed in the next step; nothing to cache before it.
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.5.1
      - run: pnpm install --frozen-lockfile
      # The Tauri context embeds the built frontend at compile time.
      - name: Build frontend
        run: pnpm --filter @scoplen/app build
      - name: Show pinned toolchain
        run: rustup show active-toolchain
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --no-fail-fast

  dependencies:
    name: Rust dependencies
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authorize access to proto
        if: env.SCOPLEN_PROTO_TOKEN != ''
        shell: bash
        run: git config --global url."https://x-access-token:${SCOPLEN_PROTO_TOKEN}@github.com/scoplen/proto.git".insteadOf "https://github.com/scoplen/proto.git"
      - name: Install cargo-deny and cargo-machete
        run: cargo install --locked cargo-deny@0.20.2 cargo-machete@0.9.2
      - name: Licenses, advisories, bans, and sources
        run: cargo deny check
      - name: Unused dependencies
        run: cargo machete

  ssh-private-key-interop:
    name: OpenSSH key and proxy interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authorize access to proto
        if: env.SCOPLEN_PROTO_TOKEN != ''
        shell: bash
        run: git config --global url."https://x-access-token:${SCOPLEN_PROTO_TOKEN}@github.com/scoplen/proto.git".insteadOf "https://github.com/scoplen/proto.git"
      - name: Ed25519, NIST ECDSA, and RSA SHA-2 acceptance and refusal
        shell: pwsh
        run: ./scripts/test-ssh-private-key.ps1
      - name: SOCKS5, HTTP CONNECT, and saved ProxyCommand trust, timeout, and cleanup
        shell: pwsh
        run: ./scripts/test-ssh-proxy-route.ps1
      - name: Saved SSH-agent identity, trust, failure, timeout, and cancellation
        shell: pwsh
        run: ./scripts/test-ssh-agent-unix.ps1
      - name: Saved jump chains, independent trust and credentials, cancellation, and reconnect
        shell: pwsh
        run: ./scripts/test-ssh-jump.ps1
      - name: Rust terminal reconnect, normal exit, cancellation, current credentials, and exhaustion
        shell: pwsh
        run: ./scripts/test-ssh-session-reconnect.ps1
      - name: Terminal-owned SFTP browse, download, refusal, and cancellation
        shell: pwsh
        run: ./scripts/test-ssh-session-files.ps1

  windows-agent-interop:
    name: Windows native agent login
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authorize access to proto
        if: env.SCOPLEN_PROTO_TOKEN != ''
        shell: bash
        run: git config --global url."https://x-access-token:${SCOPLEN_PROTO_TOKEN}@github.com/scoplen/proto.git".insteadOf "https://github.com/scoplen/proto.git"
      - name: Start isolated runner OpenSSH agent
        shell: pwsh
        run: |
          Set-Service ssh-agent -StartupType Manual
          Start-Service ssh-agent
      - name: Saved AgentStream identity, SSH command, and failure controls
        shell: pwsh
        run: ./scripts/test-ssh-agent-windows.ps1

  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # pnpm is installed in the next step; nothing to cache before it.
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm license-check

  app:
    name: Build and launch (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build: pnpm tauri build --bundles app
            binary: target/release/bundle/macos/Scoplen.app/Contents/MacOS/scoplen
          - os: windows-latest
            build: pnpm tauri build --bundles nsis
            binary: target/release/scoplen.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authorize access to proto
        if: env.SCOPLEN_PROTO_TOKEN != ''
        shell: bash
        run: git config --global url."https://x-access-token:${SCOPLEN_PROTO_TOKEN}@github.com/scoplen/proto.git".insteadOf "https://github.com/scoplen/proto.git"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # pnpm is installed in the next step; nothing to cache before it.
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.5.1
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: ${{ matrix.build }}
      - name: Launch until the first screen renders
        shell: bash
        env:
          SPL_SMOKE_TEST: "1"
        run: ${{ matrix.binary }}
      - name: No network connection while sync is disabled
        if: runner.os == 'macOS'
        run: scripts/check-offline.sh target/release/bundle/macos/Scoplen.app
