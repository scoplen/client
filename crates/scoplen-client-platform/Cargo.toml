[package]
name = "scoplen-client-platform"
description = "Platform integration of the Scoplen desktop client on macOS and Windows."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
base64 = "0.22.1"
getrandom = "0.3.4"
p256 = { version = "0.14.0", features = ["ecdsa"] }
sys-locale.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_TpmBaseServices"] }

[dev-dependencies]
tempfile.workspace = true

# The platform layer is the only crate allowed to contain unsafe code
# (`scoplen-docs/11-client-architecture.md` §3). It is denied by default and
# allowed only on the module that needs it, with each block documented.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
