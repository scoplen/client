[package]
name = "scoplen-client-core"
description = "Platform-independent logic of the Scoplen desktop client."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
live-server-integration = []

[dependencies]
base64.workspace = true
bytes = "1.12.1"
futures-util = { version = "0.3.32", default-features = false, features = ["sink", "std"] }
h2 = "0.4.20"
http = "1.5.0"
reqwest.workspace = true
rusqlite.workspace = true
rustls.workspace = true
rustls-platform-verifier = "0.7.1"
scoplen-api.workspace = true
scoplen-client-platform.workspace = true
scoplen-crypto.workspace = true
scoplen-model.workspace = true
scoplen-ssh.workspace = true
ssh-key.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
specta.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
uuid.workspace = true
zeroize.workspace = true
httpdate = "1.0.3"
tokio-tungstenite = { version = "=0.30.0", default-features = false }
unicode-normalization = "=0.1.25"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[lints]
workspace = true

[dev-dependencies]
rcgen.workspace = true
russh = { version = "=0.65.0", default-features = false, features = ["des", "flate2", "ring", "rsa"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
