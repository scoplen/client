[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

[advisories]
version = 2
ignore = [
    # `paste` is archived but has no known vulnerability. It is a compile-time
    # macro used by `specta`, which generates the IPC bindings; no `paste` code
    # runs in the application. Remove when specta drops it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time macro via specta; no runtime code" },
    # The pinned shared SSH stack still uses pre-release RSA. Patched RSA 0.10.0
    # requires the matching ssh-key feature/API upgrade. Remove this existing
    # exception with that coordinated shared dependency update.
    { id = "RUSTSEC-2023-0071", reason = "tracked pre-release RSA dependency in the bounded SSH adapter; stable-RSA migration remains pending" },
    # age uses these only for translation proc-macro configuration and diagnostics.
    # Neither advisory reports a vulnerability; remove when age replaces the macros.
    { id = "RUSTSEC-2026-0374", reason = "unmaintained basic-toml is used only by age's translation proc-macro build configuration" },
    { id = "RUSTSEC-2026-0173", reason = "unmaintained proc-macro-error2 supplies only age's translation compile-time diagnostics" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    # Cedar's ar_archive_writer build dependency adds permissive LLVM exceptions.
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    # arboard's Windows text clipboard dependencies use the reviewed Boost license.
    { name = "clipboard-win", version = "=5.4.3", allow = ["BSL-1.0"] },
    { name = "error-code", version = "=3.4.0", allow = ["BSL-1.0"] },
    # SQLCipher's reviewed source bundle includes SQLite and LibTomCrypt licenses.
    { name = "sqlcipher-src", version = "=420.0.0", allow = ["blessing", "WTFPL"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/scoplen/proto.git"]
